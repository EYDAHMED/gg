name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install web dependencies and build dist
        working-directory: physics-companion
        env:
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android, Vosk Offline Wake-Word & Native Overrides
        working-directory: physics-companion
        run: |
          npm install @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Physics" "com.physics.companion" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          if [ -d android-overrides ]; then
            cp -r android-overrides/* android/
          fi

          mkdir -p android/app/src/main/assets
          if [ ! -d android/app/src/main/assets/model-en-us ]; then
            curl -L -o vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            unzip -q vosk-model.zip -d android/app/src/main/assets/
            mv android/app/src/main/assets/vosk-model-small-en-us-0.15 android/app/src/main/assets/model-en-us
            cat /proc/sys/kernel/random/uuid > android/app/src/main/assets/model-en-us/uuid
            rm vosk-model.zip
          fi

          if ! grep -q "com.alphacephei:vosk-android" android/app/build.gradle; then
            sed -i "/dependencies {/a \    implementation 'com.alphacephei:vosk-android:0.3.75'" android/app/build.gradle
          fi

          npx cap sync android

      - name: Build debug APK
        working-directory: physics-companion/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: physics-companion-apk
          path: physics-companion/android/app/build/outputs/apk/debug/app-debug.apk
